name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: |
          queuecal --json queuecal-report.json --markdown queuecal-report.md
          python -c "import json; r=json.load(open('queuecal-report.json')); d=r['delayed_label_audit']; assert d['day_1']['errors_observed'] == 0; assert d['day_1']['threshold_regret'] > 0; assert d['day_7']['error_observation_rate'] == 1.0; assert d['day_14']['threshold_regret'] == 0"

